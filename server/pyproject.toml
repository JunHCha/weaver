[project]
name = "weaver"
version = "0.1.0"
description = "Weaver server: Spinner and Loom"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "typer>=0.12,<1",
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10"]
build-backend = "uv_build"

[dependency-groups]
test = ["pytest>=8,<10"]
dev = [
    {include-group = "test"},
    "ruff>=0.14,<1",
    "mypy>=1.18,<3",
    "jsonschema[format-nongpl]>=4,<5",
]


[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
